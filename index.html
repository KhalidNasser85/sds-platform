<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة وصل — البوابة العامة</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#0f3460,#16213e);min-height:100vh;color:#eef2f8;padding:40px 20px}
.wrap{max-width:880px;margin:0 auto}
.hero{text-align:center;padding:0 0 30px}
.hero .logo{font-size:3em;font-weight:bold}
.hero p{color:#c7d4e4;font-size:1.1em}
.group{color:#7dc4ff;font-size:1.05em;margin:18px 0 8px;text-align:right}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:20px;text-decoration:none;color:#eef2f8;transition:.2s}
.card:hover{background:rgba(255,255,255,.12)}
.card h3{color:#7dc4ff;margin-bottom:8px}
.card span{display:block;font-size:.85em;color:#c7d4e4;direction:ltr;word-break:break-all}
.foot{margin-top:30px;text-align:center;color:#8fa3b8;font-size:.85em;border-top:1px solid rgba(255,255,255,.12);padding-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="logo">وصل</div>
    <p>منصة صلّة الوصل — مواقع الشركات والدليل والبوابات الموقّعة</p>
  </div>
  <div class="group">مواقع الشركات</div>
  <div class="cards">
    <a class="card" href="https://sds-dev01.netlify.app/"><h3>موقع شركة DEV01</h3><span>https://sds-dev01.netlify.app/</span></a>
    <a class="card" href="https://sds-dev02.netlify.app/"><h3>موقع شركة DEV02</h3><span>https://sds-dev02.netlify.app/</span></a>
  </div>
  <div class="foot">
    منصة وصل — منشورة عبر GitHub Pages · الحساب khalidnasser85
  </div>
</div>
</body>
</html>
